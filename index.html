<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firebase OTP Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 24px 16px; color: #1f2937;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #e0f7ec 0%, #f0fdf8 50%, #e6f0ff 100%);
    }
    .card {
      width: 100%; max-width: 400px; padding: 36px 30px; background: #ffffff;
      border-radius: 24px; border-top: 6px solid #10b981;
      box-shadow: 0 18px 40px rgba(16,185,129,.15), 0 2px 6px rgba(0,0,0,.06);
    }
    h2 { margin: 0 0 22px; font-size: 26px; font-weight: 700; color: #064e3b; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #4b5563; }
    input, button { width: 100%; padding: 13px 16px; margin-top: 10px; font-size: 16px; border-radius: 12px; }
    input { background: #f9fafb; color: #111827; border: 2px solid #e5e7eb; outline: none; transition: border-color .2s, background .2s; }
    input::placeholder { color: #9ca3af; }
    input:focus { border-color: #10b981; background: #fff; }
    #otp { text-align: center; letter-spacing: 10px; font-size: 22px; font-weight: 600; }
    button { border: 0; cursor: pointer; font-weight: 600; color: #fff; background: #10b981; transition: background .2s, transform .1s; }
    button:hover:not(:disabled) { background: #059669; }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #logoutBtn { background: #fee2e2; color: #b91c1c; }
    #logoutBtn:hover { background: #fecaca !important; }
    #recaptcha-container { margin-top: 10px; display: flex; justify-content: center; }
    #doneStep p { margin: 10px 0; }
    #doneStep .ok { font-size: 20px; }
    #userUid { color: #6b7280; word-break: break-all; }
    #msg { margin-top: 14px; font-size: 14px; min-height: 18px; }
    .err { color: #dc2626; } .ok { color: #059669; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Firebase OTP Demo</h2>

    <div id="phoneStep">
      <label>Phone number (with country code)</label>
      <input id="phone" type="tel" placeholder="+923001234567" />
      <div id="recaptcha-container"></div>
      <button id="sendBtn">Send OTP</button>
    </div>

    <div id="otpStep" class="hidden">
      <label>Enter the 6-digit code</label>
      <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
      <button id="verifyBtn">Verify OTP</button>
    </div>

    <div id="doneStep" class="hidden">
      <p class="ok"><b>Login successful!</b></p>
      <p>Phone: <span id="userPhone"></span></p>
      <p>UID: <small id="userUid"></small></p>
      <button id="logoutBtn">Sign out</button>
    </div>

    <div id="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // TODO: paste your Firebase web app config here (Project settings > General > Your apps)
    const firebaseConfig = {
      apiKey: "AIzaSyBI7k8yQis9Fv4ww4NXeF7tlOhp8LFmbnQ",
      authDomain: "timepass-a394c.firebaseapp.com",
      projectId: "timepass-a394c",
      storageBucket: "timepass-a394c.firebasestorage.app",
      messagingSenderId: "420912206948",
      appId: "1:420912206948:web:73f5ae629f82df4a163b71",
      measurementId: "G-FNJFK8G7FZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $ = (id) => document.getElementById(id);
    const show = (step) => {
      for (const s of ["phoneStep", "otpStep", "doneStep"]) $(s).classList.toggle("hidden", s !== step);
    };
    const say = (text, cls = "") => { $("msg").textContent = text; $("msg").className = cls; };

    let confirmation = null;
    const recaptcha = new RecaptchaVerifier(auth, "recaptcha-container", { size: "normal" });

    $("sendBtn").onclick = async () => {
      const phone = $("phone").value.trim();
      if (!phone.startsWith("+")) return say("Include the country code, e.g. +92...", "err");
      $("sendBtn").disabled = true;
      try {
        confirmation = await signInWithPhoneNumber(auth, phone, recaptcha);
        show("otpStep");
        say("OTP sent. Check your phone.", "ok");
      } catch (e) {
        say(e.code || e.message, "err");
        recaptcha.render().then((id) => window.grecaptcha.reset(id));
      }
      $("sendBtn").disabled = false;
    };

    $("verifyBtn").onclick = async () => {
      try {
        await confirmation.confirm($("otp").value.trim());
        say("");
      } catch (e) {
        say(e.code === "auth/invalid-verification-code" ? "Wrong code, try again." : (e.code || e.message), "err");
      }
    };

    $("logoutBtn").onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        $("userPhone").textContent = user.phoneNumber;
        $("userUid").textContent = user.uid;
        show("doneStep");
      } else {
        show("phoneStep");
      }
    });
  </script>
</body>
</html>
